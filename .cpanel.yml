---
deployment:
  tasks:
    - export DEPLOYPATH=/home/realtycentercom/public_html/
    - /bin/mkdir -p "$DEPLOYPATH"
    - /usr/local/bin/npm install
    - /usr/local/bin/npm run build
    - /bin/cp -R dist/. "$DEPLOYPATH"
    - /bin/mkdir -p "$DEPLOYPATH/api"
    - /bin/cp -R cpanel/api/. "$DEPLOYPATH/api"\n    - /bin/mkdir -p "$DEPLOYPATH/uploads/listings"\n    - /bin/cp -R cpanel/uploads/. "$DEPLOYPATH/uploads/"
